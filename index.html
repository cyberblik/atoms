<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atoms · private p2p chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: hidden;
        }
        
        /* Анимированный атом */
        .atom-logo {
            text-align: center;
            margin-bottom: 40px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .atom-logo:hover {
            transform: scale(1.1);
        }
        
        .atom-logo svg {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 0 10px rgba(128, 0, 255, 0.5));
        }
        
        .atom-logo circle {
            transition: all 0.3s ease;
        }
        
        .atom-logo:hover circle {
            r: 6;
        }
        
        .atom-logo:hover .electron {
            animation-duration: 1s;
        }
        
        .electron {
            animation: orbit 3s linear infinite;
        }
        
        .electron1 { animation-delay: 0s; }
        .electron2 { animation-delay: 1s; }
        .electron3 { animation-delay: 2s; }
        
        @keyframes orbit {
            from { transform: rotate(0deg) translateX(30px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(30px) rotate(-360deg); }
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Состояние после подключения */
        .container.chat-active {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }
        
        .container.chat-active .id-column {
            flex: 1;
            transition: all 0.5s ease;
        }
        
        .container.chat-active .chat-column {
            flex: 2;
            opacity: 1;
            transform: translateX(0);
        }
        
        .id-column {
            transition: all 0.5s ease;
        }
        
        .chat-column {
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.5s ease;
        }
        
        .container.chat-active .chat-column {
            opacity: 1;
            transform: translateX(0);
        }
        
        .section {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        
        .section-title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 16px;
        }
        
        /* Градиент для всех акцентных элементов */
        .gradient-text {
            background: linear-gradient(135deg, #9b59b6, #8e44ad, #6c3483);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        
        .btn {
            background: linear-gradient(135deg, #9b59b6, #8e44ad, #6c3483);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 16px 24px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        
        .btn:hover {
            transform: scale(0.98);
            filter: brightness(1.2);
        }
        
        .btn:disabled {
            background: #333;
            cursor: not-allowed;
        }
        
        .id-box {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 18px;
            text-align: center;
            color: #fff;
            border: 1px solid #333;
            margin-bottom: 20px;
            word-break: break-all;
        }
        
        /* Стили для QR-кода */
        #qrcode {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }
        
        #qrcode canvas {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
        }
        
        #qrcode img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
        }
        
        .input-group {
            display: flex;
            gap: 12px;
        }
        
        .input-group input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 40px;
            padding: 16px 20px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        
        .input-group input:focus {
            border-color: #9b59b6;
        }
        
        #chat {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 16px;
            height: 350px;
            overflow-y: auto;
            margin-bottom: 16px;
            border: 1px solid #333;
        }
        
        .message {
            margin: 16px 0;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .mine {
            text-align: right;
            color: #9b59b6;
        }
        
        .theirs {
            text-align: left;
            color: #fff;
        }
        
        .timestamp {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        
        .chat-controls {
            display: flex;
            gap: 12px;
        }
        
        .chat-controls input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 40px;
            padding: 16px 20px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        
        .note {
            color: #666;
            font-size: 13px;
            text-align: center;
            margin-top: 16px;
        }
    </style>
    <!-- PeerJS и QRCode библиотеки -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container" id="mainContainer">
        <!-- Левая колонка с ID -->
        <div class="id-column">
            <!-- Анимированный логотип -->
            <div class="atom-logo" id="logo">
                <svg viewBox="0 0 100 100">
                    <!-- Ядро -->
                    <circle cx="50" cy="50" r="8" fill="#9b59b6" filter="url(#glow)">
                        <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Орбиты -->
                    <circle cx="50" cy="50" r="30" stroke="#9b59b6" stroke-width="1" fill="none" opacity="0.3" />
                    <circle cx="50" cy="50" r="30" stroke="#9b59b6" stroke-width="1" fill="none" opacity="0.3" transform="rotate(60 50 50)" />
                    <circle cx="50" cy="50" r="30" stroke="#9b59b6" stroke-width="1" fill="none" opacity="0.3" transform="rotate(120 50 50)" />
                    
                    <!-- Электроны -->
                    <circle cx="80" cy="50" r="4" fill="#9b59b6" class="electron electron1">
                        <animate attributeName="r" values="4;6;4" dur="1s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="50" cy="80" r="4" fill="#9b59b6" class="electron electron2">
                        <animate attributeName="r" values="4;6;4" dur="1s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="20" cy="50" r="4" fill="#9b59b6" class="electron electron3">
                        <animate attributeName="r" values="4;6;4" dur="1s" repeatCount="indefinite" />
                    </circle>
                    
                    <defs>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                </svg>
            </div>

            <!-- Start секция -->
            <div class="section" id="startSection">
                <div class="section-title">start</div>
                <button id="startBtn" class="btn" style="width: 100%;">Start atoms</button>
                <div class="note">click to generate your ID</div>
            </div>

            <!-- ID секция (показывается после нажатия Start) -->
            <div class="section" id="idSection" style="display: none;">
                <div class="section-title">your id</div>
                <div id="myId" class="id-box"></div>
                <div id="qrcode"></div>
                <div class="note">share this qr or id to connect</div>
            </div>

            <!-- Connect секция -->
            <div class="section">
                <div class="section-title">connect to peer</div>
                <div class="input-group">
                    <input type="text" id="peerIdInput" placeholder="paste peer id">
                    <button id="connectBtn" class="btn">connect</button>
                </div>
            </div>
        </div>

        <!-- Правая колонка с чатом -->
        <div class="chat-column">
            <div class="section">
                <div class="section-title">chat</div>
                <div id="chat"></div>
                <div class="chat-controls">
                    <input type="text" id="messageInput" placeholder="type a message...">
                    <button id="sendBtn" class="btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Функция для переключения в режим чата
        function enableChatMode() {
            document.getElementById('mainContainer').classList.add('chat-active');
        }

        // Обработчик для логотипа (можно кликать)
        document.getElementById('logo').addEventListener('click', function() {
            this.style.transform = 'scale(1.2)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 200);
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
