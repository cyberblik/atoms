<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atoms · private p2p</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 0 20px; background: #0a0a0a; color: #fff; }
        #myIdSection { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        #qrcode { margin: 15px 0; background: #2a2a2a; padding: 10px; border-radius: 8px; display: flex; justify-content: center; }
        #chat { border: 1px solid #333; background: #1a1a1a; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        #messageInput { width: calc(100% - 70px); padding: 8px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 20px; }
        #sendBtn { width: 60px; padding: 8px; background: #9b59b6; color: white; border: none; border-radius: 20px; cursor: pointer; }
        .message { margin: 5px 0; }
        .mine { text-align: right; color: #9b59b6; }
        .theirs { text-align: left; color: #fff; }
        button { background: #9b59b6; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        input { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 20px; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <h1>⚛️ atoms · private p2p</h1>
    
    <div id="myIdSection">
        <h3>Your ID:</h3>
        <p id="myId">generating...</p>
        <div id="qrcode"></div>
        <p>share this qr or id to connect</p>
    </div>

    <div>
        <h3>Connect to peer</h3>
        <input type="text" id="peerIdInput" placeholder="paste peer id">
        <button id="connectBtn">Connect</button>
    </div>

    <div id="chat" style="display:none;"></div>
    
    <div id="chatControls" style="display:none;">
        <input type="text" id="messageInput" placeholder="type a message...">
        <button id="sendBtn">Send</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
